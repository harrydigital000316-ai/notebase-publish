<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | notebase-publish</title>
    <meta name="description" content="Search across all notes, tags, and content">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
<style>
.search-results {
    list-style: none;
    padding: 0;
}
.search-result {
    padding: 1rem;
    margin-bottom: 0.5rem;
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    transition: transform 0.15s, box-shadow 0.15s;
}
.search-result:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}
.search-result-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
}
.search-result-title a {
    color: var(--fg-primary);
    text-decoration: none;
}
.search-result-title a:hover {
    color: var(--accent);
}
.search-result-excerpt {
    color: var(--fg-secondary);
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
    line-height: 1.5;
}
.search-result-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--fg-tertiary);
}
.search-highlight {
    background: var(--accent-bg);
    padding: 0 0.125rem;
    border-radius: 2px;
}
</style>
</head>
<body class="search-page">
    <header class="site-header" role="banner">
        <div class="header-inner">
            <a href="/" class="site-title" aria-label="Home">
                <span class="title-icon">🦞</span>
                <span class="title-text">notebase-publish</span>
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="/">📝 Notes</a>
                <a href="/tags/">🏷️ Tags</a>
                <a href="/daily/">📅 Daily</a>
                <a href="/graph.html">🕸️ Graph</a>
                <a href="/search.html">🔍 Search</a>
            </nav>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="moon-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </div>
    </header>

    <main class="site-main" role="main">
<header class="page-header">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a> / <span>Search</span>
    </nav>
    <h1 class="page-title">🔍 Search</h1>
    <p class="page-subtitle">Find notes, tags, and concepts instantly</p>
</header>

<section class="search-section" aria-labelledby="search-title">
    <form action="/search.html" method="get" class="search-form search-form-large">
        <label for="search-input" class="visually-hidden">Search query</label>
        <input type="search" id="search-input" name="q" value="" placeholder="Search notes, tags, content... (try: transformer, investing, AI agent)" autocomplete="off" autofocus>
        <button type="submit" aria-label="Search">🔍 Search</button>
    </form>
</section>

<section class="results-section" aria-labelledby="results-title">
    <h2 id="results-title">Results </h2>

    <p class="empty-state">Enter a search query above to find notes.</p>
</section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>Generated by <a href="https://github.com/notebase/notebase-publish">notebase-publish</a> · AI's cognitive exoskeleton</p>
    </footer>

    <script src="/static/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('search-input');
    if (input) {
        input.focus();

        // Client-side fuzzy search debounced
        let debounceTimer;
        input.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const q = this.value.trim();
            if (q.length < 2) return;

            debounceTimer = setTimeout(() => {
                fetch('/search.json')
                    .then(r => r.json())
                    .then(index => {
                        // Simple client-side filter (can be replaced with Fuse.js)
                        const results = index.filter(item =>
                            item.title.toLowerCase().includes(q.toLowerCase()) ||
                            item.content.toLowerCase().includes(q.toLowerCase()) ||
                            item.tags.some(t => t.toLowerCase().includes(q.toLowerCase()))
                        ).slice(0, 20);
                        renderResults(results, q);
                    });
            }, 200);
        });
    }

    function highlight(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark class="search-highlight">$1</mark>');
    }

    function renderResults(results, query) {
        const container = document.querySelector('.search-results');
        if (!container) return;
        if (!results.length) {
            container.innerHTML = '<p class="empty-state">No results for <strong>"' + query + '"</strong></p>';
            return;
        }
        container.innerHTML = results.map(r => `
            <li class="search-result">
                <h3 class="search-result-title"><a href="${r.url}">${highlight(r.title, query)}</a></h3>
                <p class="search-result-excerpt">${highlight(r.excerpt, query)}</p>
                <div class="search-result-meta">
                    ${r.tags?.slice(0,5).map(t => `<span class="tag-tag">#${t}</span>`).join('') || ''}
                    ${r.created ? `<time>${r.created.slice(0,10)}</time>` : ''}
                </div>
            </li>
        `).join('');
    }
});
</script>
</body>
</html>
